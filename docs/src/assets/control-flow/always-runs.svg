<text class="cf-icon cf-fail cf-done" x="90" y="77" text-anchor="end" style="animation-name:cf-always-runs-d0">✗</text>
<circle class="cf-spinner cf-run" cx="85" cy="72" r="5" pathLength="1" style="animation:6.7s ease-in-out infinite cf-always-runs-r0, .8s linear infinite cf-spin"/>
</g>
<g class="cf-step">
<rect class="cf-box" x="184" y="52" width="96" height="40" rx="8"/>
<rect class="cf-box cf-skip cf-done" x="184" y="52" width="96" height="40" rx="8" style="animation-name:cf-always-runs-d1"/>
<rect class="cf-box cf-running cf-run" x="184" y="52" width="96" height="40" rx="8" style="animation-name:cf-always-runs-r1"/>
<text class="cf-label cf-label-skip" x="198" y="77" style="animation-name:cf-always-runs-l1">Pack</text>
<text class="cf-icon cf-skip cf-done" x="266" y="77" text-anchor="end" style="animation-name:cf-always-runs-d1">–</text>
<circle class="cf-spinner cf-run" cx="261" cy="72" r="5" pathLength="1" style="animation:6.7s ease-in-out infinite cf-always-runs-r1, .8s linear infinite cf-spin"/>
<text class="cf-note cf-done" x="186" y="110" style="animation-name:cf-always-runs-d1">a step failed</text>
</g>
<g class="cf-step">
<text class="cf-tag" x="362" y="146">.AlwaysRuns()</text>
<rect class="cf-box" x="360" y="154" width="134" height="40" rx="8"/>
<rect class="cf-box cf-success cf-done" x="360" y="154" width="134" height="40" rx="8" style="animation-name:cf-always-runs-d2"/>
<rect class="cf-box cf-running cf-run" x="360" y="154" width="134" height="40" rx="8" style="animation-name:cf-always-runs-r2"/>
<text class="cf-label cf-label-success" x="374" y="179" style="animation-name:cf-always-runs-l2">UploadLogs</text>
<text class="cf-icon cf-success cf-done" x="480" y="179" text-anchor="end" style="animation-name:cf-always-runs-d2">✓</text>
<circle class="cf-spinner cf-run" cx="475" cy="174" r="5" pathLength="1" style="animation:6.7s ease-in-out infinite cf-always-runs-r2, .8s linear infinite cf-spin"/>
</g>
</svg>
