name: Release

# Publishes the Baun and Baun.Cli packages to nuget.org with trusted publishing:
# https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing
#
# Runs only when a GitHub release is published. The release's tag sets the package version,
# for example the tag v1.2.3 publishes version 1.2.3.
#
# The trusted publishing policy on nuget.org must match this workflow:
#   Repository Owner: sandrofigo
#   Repository:       baun
#   Workflow File:    release.yml
#   Environment:      release
#
# The repository secret NUGET_USER must hold the nuget.org username (profile name, not the email address)
# of the account that owns the policy.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Get version from release tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not a version such as v1.2.3 or v1.2.3-preview.1."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test --solution Baun.slnx --configuration Release

      - name: Pack
        run: >
          dotnet pack Baun.slnx
          --configuration Release
          --output artifacts
          -p:Version=${{ steps.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    # Optional protection: add required reviewers to this environment in the repository settings
    # to approve each release before it is pushed to nuget.org.
    environment: release

    permissions:
      id-token: write # Lets NuGet/login request a GitHub OIDC token for trusted publishing.

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Exchanges the OIDC token for a temporary nuget.org API key, valid for one hour,
      # so this runs right before the push.
      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
