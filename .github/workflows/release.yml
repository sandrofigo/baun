name: Release

# Publishes the Baun and Baun.Cli packages to nuget.org with trusted publishing, then creates the GitHub release:
# https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing
#
# Runs when a version tag is pushed, for example v1.2.3, which publishes version 1.2.3.
# The steps are in the baun build in build/, run with build.sh, which installs the .NET SDK if it's missing.
# Pack validates CHANGELOG.md, tests and packs; GitHubRelease pushes the packages and creates the GitHub release with the version's changelog entries.
#
# The trusted publishing policy on nuget.org must match this workflow:
#   Repository Owner: sandrofigo
#   Repository:       baun
#   Workflow File:    release.yml
#   Environment:      release
#
# The repository secret NUGET_USER must hold the nuget.org username (profile name, not the email address)
# of the account that owns the policy.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Validate changelog, test and pack
        run: ./build.sh Pack

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    # Optional protection: add required reviewers to this environment in the repository settings
    # to approve each release before it is pushed to nuget.org.
    environment: release

    permissions:
      contents: write # Lets the build create the GitHub release.
      id-token: write # Lets NuGet/login request a GitHub OIDC token for trusted publishing.

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts

      # Exchanges the OIDC token for a temporary nuget.org API key, valid for one hour,
      # so this runs right before the push.
      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages and create GitHub release
        run: ./build.sh GitHubRelease
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
