name: Docs

# Builds the Starlight site in docs/ and deploys it to Cloudflare Workers at https://baun.dev.
# Pull requests only build the site.
#
# Requires these repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN:  an API token with the "Edit Cloudflare Workers" template permissions
#   CLOUDFLARE_ACCOUNT_ID: the ID of the Cloudflare account that owns the baun.dev zone

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: docs

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: docs
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
