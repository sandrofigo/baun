<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>baun · plan</title>
<style>
  :root {
    --accent: #6b81ff;
    --bg: #f7f7f9;
    --dot: #d4d6de;
    --card: #ffffff;
    --border: #d9dbe3;
    --text: #1d1f27;
    --faint: #80838f;
    --edge: #a3a7b5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15161b;
      --dot: #2c2e37;
      --card: #1e2027;
      --border: #33363f;
      --text: #e6e7ec;
      --faint: #8b8e9a;
      --edge: #5a5e6c;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #canvas {
    position: fixed;
    inset: 0;
    cursor: grab;
    touch-action: none;
    background-image: radial-gradient(var(--dot) 1px, transparent 1px);
  }
  #canvas.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  /* The style of a line says what it means, the same as in the docs: solid for a dependency, dashed for an order and
     dotted for a trigger. */
  #edges > path, #legend path { fill: none; stroke: var(--edge); stroke-width: 1.5; }
  path.order { stroke-dasharray: 6 4; }
  path.trigger { stroke-dasharray: 1 5; stroke-linecap: round; stroke-width: 2; }
  #edges > path.idle { opacity: 0.45; }
  #edges > path.highlight { stroke: var(--accent); stroke-width: 2; opacity: 1; }
  #arrow path { fill: var(--edge); stroke: none; }
  #arrow-highlight path { fill: var(--accent); stroke: none; }
  /* While a step is hovered, the steps and lines outside its flow fade. */
  #world .step, #edges > path { transition: opacity 0.15s; }
  #world.focus .step:not(.highlight) { opacity: 0.35; }
  #world.focus #edges > path:not(.highlight) { opacity: 0.15; }
  #legend {
    position: fixed;
    left: 16px;
    bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 8px 12px;
    color: var(--faint);
    font-size: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  #legend:empty { display: none; }
  #legend div { display: flex; align-items: center; gap: 8px; }
  .step {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 10px;
    height: 40px;
    padding: 0 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    white-space: nowrap;
    user-select: none;
  }
  .step.highlight { border-color: var(--accent); }
  .step .order { color: var(--faint); font-variant-numeric: tabular-nums; }
  .step.skipped { color: var(--faint); background: transparent; }
  /* A step in the hovered flow looks like one that runs, since it would run for the hovered step. */
  .step.skipped.highlight { color: var(--text); background: var(--card); }
  .step .tag { color: var(--faint); font-size: 0.85em; border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }
  header {
    position: fixed;
    left: 16px;
    right: 16px;
    top: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    pointer-events: none;
  }
  header h1 { margin: 0; font-size: 14px; font-weight: normal; color: var(--accent); }
  /* The gradient of the logotype, the same as on baun.dev */
  header h1 .logo { background: linear-gradient(90deg, #6b81ff, #f789fe); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tool {
    pointer-events: auto;
    font: inherit;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    padding: 0;
    cursor: pointer;
  }
  .tool:hover { border-color: var(--accent); color: var(--accent); }
  #fit { margin-left: auto; }
  #zoom { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
</style>
</head>
<body>
<div id="canvas">
  <div id="world">
    <svg id="edges" width="1" height="1">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="10.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
        <marker id="arrow-highlight" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="10.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
      </defs>
    </svg>
  </div>
</div>
<header>
  <h1><span class="logo">baun</span> · plan</h1>
  <button id="fit" class="tool" type="button" title="Fit to screen" aria-label="Fit to screen">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
  </button>
</header>
<div id="legend"></div>
<div id="zoom">
  <button id="zoom-in" class="tool" type="button" title="Zoom in" aria-label="Zoom in">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
  </button>
  <button id="zoom-out" class="tool" type="button" title="Zoom out" aria-label="Zoom out">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 8h10"/></svg>
  </button>
</div>
<script>
(() => {
  const plan = /*PLAN*/null;
  const steps = plan ? plan.steps : [];
  // Sizes and positions of the steps are multiples of the grid spacing, so the steps line up with the dots.
  const grid = 20;
  const columnGap = 4 * grid;
  const rowGap = grid;
  const stepHeight = 2 * grid;


  const canvas = document.getElementById("canvas");
  const world = document.getElementById("world");
  const svg = document.getElementById("edges");

  // All steps of the build are shown. The steps that run are numbered in the order they run, the others are dimmed.
  // A step skipped with --skip keeps its number but is dimmed too, and a step with a condition is tagged "if".
  const byName = new Map();
  for (const step of steps) {
    const element = document.createElement("div");
    element.className = step.order && !step.skipped ? "step" : "step skipped";
    if (step.order) {
      const order = document.createElement("span");
      order.className = "order";
      order.textContent = step.order + ".";
      element.append(order);
    }
    const name = document.createElement("span");
    name.textContent = step.name;
    element.append(name);
    if (step.condition) element.append(tag("if", "Only when " + step.condition));
    if (step.skipped) element.append(tag("skipped", "Skipped with --skip"));
    world.appendChild(element);
    byName.set(step.name, { step, element, incoming: [], outgoing: [] });
  }

  function tag(text, title) {
    const element = document.createElement("span");
    element.className = "tag";
    element.textContent = text;
    element.title = title;
    return element;
  }

  // The edges between steps, each pointing from the step that comes first: "dependency" from a dependency, "trigger"
  // from the step that triggers it, and "order" from a step it runs after (After and Before). Two steps get one edge, the
  // first of these kinds that applies.
  const edges = [];
  const connected = new Set();
  function connect(fromName, toName, kind) {
    const from = byName.get(fromName), to = byName.get(toName);
    const key = fromName + "\n" + toName;
    if (!from || !to || connected.has(key)) return;
    connected.add(key);
    const edge = { from, to, kind };
    edges.push(edge);
    to.incoming.push(edge);
    from.outgoing.push(edge);
  }
  for (const { step } of byName.values()) for (const name of step.dependencies) connect(name, step.name, "dependency");
  for (const { step } of byName.values()) for (const name of step.triggers ?? []) connect(step.name, name, "trigger");
  for (const { step } of byName.values()) for (const name of step.after ?? []) connect(name, step.name, "order");

  // A step's column is one after the deepest step that comes before it. A step in a cycle stops the search, so a cycle
  // can't hang it.
  function columnOf(node, visiting = new Set()) {
    if (node.column !== undefined) return node.column;
    if (visiting.has(node)) return 0;
    visiting.add(node);
    const column = node.incoming.reduce((max, { from }) => Math.max(max, columnOf(from, visiting) + 1), 0);
    visiting.delete(node);
    return node.column = column;
  }
  for (const node of byName.values()) columnOf(node);

  // A step that nothing comes before moves right, next to the first step that comes after it, so its lines stay short.
  for (const node of byName.values()) {
    if (node.incoming.length === 0 && node.outgoing.length > 0) {
      node.column = Math.min(...node.outgoing.map(({ to }) => to.column)) - 1;
    }
  }

  for (const node of byName.values()) {
    node.width = Math.ceil(node.element.offsetWidth / grid) * grid;
    node.element.style.width = node.width + "px";
    node.height = stepHeight;
  }

  // The columns hold the steps and a waypoint for every line that passes through them, so a long line gets a row of its
  // own in each column it passes instead of crossing the steps there. A line that points back, which only a cycle has,
  // has no waypoints and isn't part of the ordering.
  const columns = [];
  const add = item => (columns[item.column] ??= []).push(item);
  for (const node of byName.values()) add(node);
  for (const edge of edges) {
    edge.chain = [edge.from];
    if (edge.to.column > edge.from.column) {
      for (let column = edge.from.column + 1; column < edge.to.column; column++) {
        const waypoint = { column, width: 0, height: 0 };
        add(waypoint);
        edge.chain.push(waypoint);
      }
    }
    edge.chain.push(edge.to);
  }
  for (let column = 0; column < columns.length; column++) columns[column] ??= [];
  for (const items of columns) for (const item of items) { item.before = []; item.after = []; }
  for (const edge of edges) {
    if (edge.to.column <= edge.from.column) continue;
    for (let i = 1; i < edge.chain.length; i++) {
      edge.chain[i - 1].after.push(edge.chain[i]);
      edge.chain[i].before.push(edge.chain[i - 1]);
    }
  }

  const reindex = items => items.forEach((item, index) => item.index = index);
  columns.forEach(reindex);

  // The lines between two neighboring columns that cross.
  function crossingsAfter(items) {
    const segments = items.flatMap(item => item.after.map(next => [item.index, next.index]));
    let count = 0;
    for (let i = 0; i < segments.length; i++) {
      for (let j = i + 1; j < segments.length; j++) {
        if ((segments[i][0] - segments[j][0]) * (segments[i][1] - segments[j][1]) < 0) count++;
      }
    }
    return count;
  }
  const crossings = () => columns.reduce((sum, items) => sum + crossingsAfter(items), 0);

  // The lines of u and v that cross while u is above v.
  function crossingsOf(u, v) {
    let count = 0;
    for (const side of ["before", "after"]) {
      for (const a of u[side]) for (const b of v[side]) if (a.index > b.index) count++;
    }
    return count;
  }

  // Orders the steps of each column to cross as few lines as possible. Each sweep sorts a column by the average row of
  // the items it connects to in the column before (or after, sweeping back), and then swaps neighbors while that crosses
  // fewer lines. The order with the fewest crossings wins.
  let best = columns.map(items => [...items]), fewest = crossings();
  for (let round = 0; round < 24 && fewest > 0; round++) {
    const forward = round % 2 === 0;
    const order = forward ? columns.keys() : [...columns.keys()].reverse();
    for (const column of order) {
      const items = columns[column];
      for (const item of items) {
        const neighbors = forward ? item.before : item.after;
        item.rank = neighbors.length
          ? neighbors.reduce((sum, neighbor) => sum + neighbor.index, 0) / neighbors.length
          : item.index;
      }
      items.sort((a, b) => a.rank - b.rank || a.index - b.index);
      reindex(items);
    }
    for (let swapped = true, pass = 0; swapped && pass < 8; pass++) {
      swapped = false;
      for (const items of columns) {
        for (let i = 0; i + 1 < items.length; i++) {
          if (crossingsOf(items[i + 1], items[i]) < crossingsOf(items[i], items[i + 1])) {
            [items[i], items[i + 1]] = [items[i + 1], items[i]];
            reindex(items);
            swapped = true;
          }
        }
      }
    }
    const count = crossings();
    if (count < fewest) {
      fewest = count;
      best = columns.map(items => [...items]);
    }
  }
  best.forEach((items, column) => { columns[column] = items; reindex(items); });

  // Places the items of each column as close to the middle of the items they connect to as their order allows, so lines
  // run as straight as possible. The middles are on the grid, so the steps line up with the dots. Each pass finds the
  // closest placement that keeps the order and spacing exactly: it shifts the targets by the spacing before each item,
  // makes them rise with pool adjacent violators and shifts them back.
  const gapBetween = (a, b) => a.height / 2 + rowGap + b.height / 2;
  for (const items of columns) {
    items.forEach((item, index) => item.y = index === 0 ? 0 : items[index - 1].y + gapBetween(items[index - 1], item));
  }
  for (const items of columns) {
    const height = items.length ? items.at(-1).y : 0;
    for (const item of items) item.y -= Math.round(height / 2 / grid) * grid;
  }

  function place(items, sides) {
    const spacing = [];
    items.forEach((item, index) => spacing[index] = index === 0 ? 0 : spacing[index - 1] + gapBetween(items[index - 1], item));
    const targets = items.map((item, index) => {
      const neighbors = sides.flatMap(side => item[side]);
      const middle = neighbors.length ? neighbors.reduce((sum, neighbor) => sum + neighbor.y, 0) / neighbors.length : item.y;
      return middle - spacing[index];
    });
    const blocks = [];
    for (const target of targets) {
      blocks.push({ sum: target, count: 1 });
      while (blocks.length > 1 && blocks.at(-2).sum / blocks.at(-2).count > blocks.at(-1).sum / blocks.at(-1).count) {
        const last = blocks.pop();
        blocks.at(-1).sum += last.sum;
        blocks.at(-1).count += last.count;
      }
    }
    let index = 0;
    for (const { sum, count } of blocks) {
      for (let i = 0; i < count; i++, index++) {
        const y = Math.round((sum / count + spacing[index]) / grid) * grid;
        items[index].y = index === 0 ? y : Math.max(y, items[index - 1].y + gapBetween(items[index - 1], items[index]));
      }
    }
  }
  for (let round = 0; round < 8; round++) {
    const forward = round % 2 === 0;
    const order = forward ? [...columns.keys()] : [...columns.keys()].reverse();
    for (const column of order) place(columns[column], [forward ? "before" : "after"]);
  }
  for (const items of columns) place(items, ["before", "after"]);

  const columnWidths = columns.map(items => Math.max(0, ...items.map(item => item.width)));
  let x = 0;
  columns.forEach((items, column) => {
    for (const item of items) {
      item.x = x;
      item.right = x + item.width;
      if (item.element) {
        item.element.style.left = item.x + "px";
        item.element.style.top = item.y - stepHeight / 2 + "px";
      }
    }
    // A waypoint spans the whole column, so a line passes the steps there straight.
    for (const item of items) if (!item.element) item.right = x + columnWidths[column];
    x += columnWidths[column] + columnGap;
  });

  const all = columns.flat();
  let top = all.length ? Math.min(...all.map(item => item.y - item.height / 2)) : 0;
  let bottom = all.length ? Math.max(...all.map(item => item.y + item.height / 2)) : stepHeight;

  // A line runs from the right side of a step through its waypoints to the left side of the next step, with curves
  // between the columns.
  for (const edge of edges) {
    const { from, to: node, kind, chain } = edge;
    let d = `M${from.right},${from.y}`;
    for (let i = 1; i < chain.length; i++) {
      const previous = chain[i - 1], item = chain[i];
      const x1 = previous.right, x2 = item === node ? item.x - 2 : item.x;
      const bend = Math.max(40, (x2 - x1) / 2);
      d += ` C${x1 + bend},${previous.y} ${x2 - bend},${item.y} ${x2},${item.y}`;
      if (item !== node) d += ` L${item.right},${item.y}`;
    }

    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    if (kind !== "dependency") path.classList.add(kind);
    // A line to or from a step that doesn't run is faint.
    if (!from.step.order || !node.step.order) path.classList.add("idle");
    path.setAttribute("marker-end", "url(#arrow)");
    svg.appendChild(path);
    edge.path = path;
  }

  // The legend explains the kinds of lines the graph has.
  const legend = document.getElementById("legend");
  for (const [kind, text] of [["dependency", "dependency"], ["order", "order, when both run"], ["trigger", "trigger"]]) {
    if (!edges.some(edge => edge.kind === kind)) continue;
    const row = document.createElement("div");
    row.innerHTML = `<svg width="32" height="8" aria-hidden="true"><path d="M2,4 H30" class="${kind}"/></svg>`;
    row.append(text);
    legend.append(row);
  }

  // Hovering a step highlights its flow: the steps that run when it's run on its own, with the lines between them. That's
  // the step, its dependencies and the steps it triggers, and theirs in turn. Lines of order between them are highlighted
  // too, while everything else fades.
  for (const node of byName.values()) {
    node.element.addEventListener("pointerenter", () => setHighlight(node, true));
    node.element.addEventListener("pointerleave", () => setHighlight(node, false));
  }

  function setHighlight(start, on) {
    const flow = new Set([start]);
    const lines = new Set();
    for (const node of flow) {
      for (const edge of node.incoming) if (edge.kind === "dependency") { flow.add(edge.from); lines.add(edge); }
      for (const edge of node.outgoing) if (edge.kind === "trigger") { flow.add(edge.to); lines.add(edge); }
    }
    for (const edge of edges) if (edge.kind === "order" && flow.has(edge.from) && flow.has(edge.to)) lines.add(edge);

    world.classList.toggle("focus", on);
    for (const node of flow) node.element.classList.toggle("highlight", on);
    for (const { path } of lines) {
      path.classList.toggle("highlight", on);
      path.setAttribute("marker-end", on ? "url(#arrow-highlight)" : "url(#arrow)");
    }
  }

  const view = { x: 0, y: 0, scale: 1 };
  let gridStep = 1;

  function apply() {
    world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
    // The grid doubles its spacing when the dots get closer than 12px on screen, and halves it when they get further
    // apart than 48px. The overlap lets it keep a spacing for a while, so it doesn't switch back and forth. Every other
    // dot stays where it is, because the dots sit on multiples of the spacing from the world origin.
    while (grid * gridStep * view.scale < 12) gridStep *= 2;
    while (grid * gridStep * view.scale > 48 && gridStep > 1 / 1024) gridStep /= 2;
    const size = grid * gridStep * view.scale;
    canvas.style.backgroundSize = `${size}px ${size}px`;
    // A dot is drawn in the middle of its tile, so the tiles start half a tile before the world origin.
    canvas.style.backgroundPosition = `${view.x - size / 2}px ${view.y - size / 2}px`;
  }

  function fit() {
    const width = Math.max(1, x - columnGap), height = bottom - top;
    const margin = 64, header = 56;
    const scale = Math.min(1.5, (innerWidth - 2 * margin) / width, (innerHeight - header - 2 * margin) / height);
    view.scale = Math.max(0.1, scale);
    view.x = (innerWidth - width * view.scale) / 2;
    view.y = header + (innerHeight - header - height * view.scale) / 2 - top * view.scale;
    apply();
  }

  let drag = null;
  canvas.addEventListener("pointerdown", event => {
    if (event.button !== 0) return;
    drag = { x: event.clientX - view.x, y: event.clientY - view.y };
    canvas.setPointerCapture(event.pointerId);
    canvas.classList.add("panning");
  });
  canvas.addEventListener("pointermove", event => {
    if (!drag) return;
    view.x = event.clientX - drag.x;
    view.y = event.clientY - drag.y;
    apply();
  });
  const endDrag = () => { drag = null; canvas.classList.remove("panning"); };
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);

  // Zooms by factor, keeping the point at x, y on screen in place.
  function zoomAt(x, y, factor) {
    const scale = Math.min(4, Math.max(0.1, view.scale * factor));
    view.x = x - (x - view.x) * (scale / view.scale);
    view.y = y - (y - view.y) * (scale / view.scale);
    view.scale = scale;
    apply();
  }

  canvas.addEventListener("wheel", event => {
    event.preventDefault();
    zoomAt(event.clientX, event.clientY, Math.exp(-event.deltaY * (event.deltaMode === 1 ? 0.05 : 0.0015)));
  }, { passive: false });

  canvas.addEventListener("dblclick", fit);
  document.getElementById("fit").addEventListener("click", fit);
  document.getElementById("zoom-in").addEventListener("click", () => zoomAt(innerWidth / 2, innerHeight / 2, 1.25));
  document.getElementById("zoom-out").addEventListener("click", () => zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.25));
  fit();
})();
</script>
</body>
</html>
